name: Tests and publication privacy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Configuration, privacy and location tests
        run: ./scripts/test.sh
      - name: Check the complete publishable Git history
        run: python3 scripts/verify_publication_privacy.py --repository . --ref HEAD
